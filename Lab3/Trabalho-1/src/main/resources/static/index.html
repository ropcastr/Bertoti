<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Sistema Acadêmico - Gestão de Alunos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.2.1/dist/axios.min.js"></script>
</head>
<body>
    <div class="container py-4">
        <!-- Cabeçalho Principal -->
        <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom">
            <div>
                <h1 class="h2 mb-1 text-primary font-weight-bold">
                    <i class="fas fa-graduation-cap mr-2"></i>Sistema Acadêmico
                </h1>
                <p class="text-muted mb-0">Gestão de Alunos com Spring Boot e H2 Database</p>
            </div>
            <div class="mt-3 mt-md-0 d-flex gap-2">
                <a href="/h2-console" target="_blank" class="btn btn-outline-secondary mr-2" title="Abrir console do banco H2">
                    <i class="fas fa-database mr-1"></i> H2 Console
                </a>
                <a href="/alunos" target="_blank" class="btn btn-outline-info mr-2" title="Ver JSON da API REST">
                    <i class="fas fa-code mr-1"></i> API REST
                </a>
                <button id="openModalBtn" class="btn btn-primary shadow-sm font-weight-bold">
                    <i class="fas fa-user-plus mr-1"></i> Novo Aluno
                </button>
            </div>
        </header>

        <!-- Barra de Busca e Estatísticas -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-8 mb-2 mb-md-0">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-white border-right-0">
                            <i class="fas fa-search text-muted"></i>
                        </span>
                    </div>
                    <input type="text" id="searchInput" class="form-control border-left-0" placeholder="Buscar por nome, e-mail ou curso...">
                </div>
            </div>
            <div class="col-md-4 text-md-right">
                <span class="badge badge-pill badge-light p-2 border font-weight-normal text-secondary">
                    Total cadastrado: <strong id="totalAlunos" class="text-primary font-weight-bold">0</strong> alunos
                </span>
            </div>
        </div>

        <!-- Modal de Cadastro / Edição -->
        <div id="modalAluno" class="custom-modal">
            <div class="custom-modal-content">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 id="modalTitle" class="h5 mb-0 text-dark font-weight-bold">Matricular Novo Aluno</h3>
                    <button id="closeModalBtn" class="close" aria-label="Fechar">&times;</button>
                </div>
                <form id="alunoForm">
                    <input type="hidden" id="alunoId">
                    <div class="form-group">
                        <label for="nomeAluno" class="font-weight-bold">Nome Completo</label>
                        <input type="text" class="form-control" id="nomeAluno" placeholder="Ex: Lucas Gabriel Rocha" required>
                    </div>
                    <div class="form-group">
                        <label for="emailAluno" class="font-weight-bold">E-mail Institucional</label>
                        <input type="email" class="form-control" id="emailAluno" placeholder="Ex: lucas.rocha@faculdade.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="cursoAluno" class="font-weight-bold">Curso</label>
                        <input list="cursosSugestoes" class="form-control" id="cursoAluno" placeholder="Selecione ou digite o curso..." required>
                        <datalist id="cursosSugestoes">
                            <option value="Engenharia de Software">
                            <option value="Ciência da Computação">
                            <option value="Sistemas de Informação">
                            <option value="Análise e Desenvolvimento de Sistemas">
                            <option value="Engenharia da Computação">
                            <option value="Banco de Dados">
                            <option value="Inteligência Artificial">
                        </datalist>
                    </div>
                    <div class="d-flex justify-content-end mt-4">
                        <button type="button" id="cancelModalBtn" class="btn btn-secondary mr-2">Cancelar</button>
                        <button type="submit" id="submitBtn" class="btn btn-success font-weight-bold">Salvar Aluno</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de Alunos -->
        <main>
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-secondary font-weight-bold">
                        <i class="fas fa-users mr-2 text-primary"></i>Alunos Matriculados
                    </h5>
                    <button id="btnRecarregar" class="btn btn-sm btn-outline-secondary" title="Recarregar lista">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <ul id="aluno-list" class="list-group list-group-flush">
                    <!-- Itens renderizados dinamicamente via index.js -->
                </ul>
            </div>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
