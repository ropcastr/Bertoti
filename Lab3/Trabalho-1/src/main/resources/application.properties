# ===================================================================
# Configurações do Console do Banco H2 (Acesso Web para Estudos)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Configurações da Conexão JDBC e DataSource (H2 em memória)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:academicodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# Inicialização Automática do Esquema SQL (schema.sql) via Spring JDBC
# ===================================================================
spring.sql.init.mode=always
